# Cache cleanup for the ONLINE map sources (run weekly by
# scripts/cache_cleanup.sh via the systemd user timer
# scripts/systemd/mapproxy-cache-cleanup.timer — see README "Cache cleanup").
#
# Tiles older than 90 days are removed and fetched again on the next view, so
# the street/topo/cadastre layers follow their sources. NOT cleaned on
# purpose: the photo caches (gm_cache, gm_hybrid_cache, esri_cache,
# bing_cache, cuzk_wm_cache) — the photographs change rarely and the robot
# needs them offline in the garden.
# Check with:  scripts/cache_cleanup.sh --dry-run
# (one task per grid: MapProxy cleans caches of one grid together)
cleanups:
  online_gm_grid_90d:
    caches: [otm_cache, cuzk_ztm_cache, cuzk_kn_cache, cuzk_contours_cache, cuzk_hillshade_cache,
             cuzk_slope_cache, cuzk_ruian_cache, gm_map_cache]
    remove_before:
      days: 90
  osm_90d:
    caches: [osm_cache]
    remove_before:
      days: 90
