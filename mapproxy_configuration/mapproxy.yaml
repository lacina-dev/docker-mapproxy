services:
  #sets up how to make the source data available
  demo:
  kml:
  wmts:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  wms:
    #srs sets the coordinate reference systems as which you want to make your data available. MapProxy reprojects the source data very well to these projections.
#    srs: ['EPSG:3857']
#    image_formats: ['image/png']
    md:
      # metadata used in capabilities documents
      title: Mapproxy OSM cache
      abstract: This is the MapProxy
      fees: 'None'


layers:
  #sets up which layers you want to make available using the services above. You can add many, but let's stick to osm data here.
  - name: osm_demo      # access in JOSM as TMS: http://localhost:8080/tiles/1.0.0/osm_demo/webmercator/{zoom}/{x}/{y}.png
    title: Open Streetmap Tiles (test)
    sources: [osm_cache]
  # gm_layer: Google satellite, UNCHANGED (cache gm_cache, PNG URL). Its
  # files on the robot are named *.png but hold the JPEG Google sends (MapProxy
  # stores a source tile as received); switching the cache to image/jpeg would
  # look for *.jpeg and lose the warm offline cache of the default base map.
  - name: gm_layer
    title: Test of using GM tiles
    sources: [ gm_cache ]
  # cuzk_layer: the OLD PNG URL of the CUZK orthophoto (pages opened before
  # an update, the UI's built-in fallback list, JOSM/QGIS bookmarks). Since
  # 2026-11-08 it reads the JPEG cache of cuzk_ortho_layer, stores nothing: a
  # tile already in that cache goes out as is (JPEG bytes, Content-Type
  # image/png; browsers decode by content), only a missing one is fetched and
  # re-encoded to PNG.
  - name: cuzk_layer
    title: CUZK ortofoto CR (legacy PNG URL of cuzk_ortho_layer)
    sources: [ cuzk_png_compat ]
  # ---- added 2026-11-08 (map sources for the robot UI) -------------------
  # The UI lists these from ui_sources.json (same directory): keep the two in
  # step ("layer" there = name here). All on gm_grid (EPSG:3857, origin ul,
  # z0-z21): the UI fetches /wmts/<name>/gm_grid/{z}/{x}/{y}.<png|jpeg>.
  - name: cuzk_ztm_layer
    title: CUZK ZTM - Base topographic map of CR (open data, no key)
    sources: [cuzk_ztm_cache]
  - name: otm_layer
    title: OpenTopoMap (CC-BY-SA, no key, max z17)
    sources: [otm_cache]
  # overlays (transparent PNG unless noted)
  - name: cuzk_kn_layer
    title: CUZK cadastre - parcels and boundaries, light lines (overlay)
    sources: [cuzk_kn_cache]
  - name: cuzk_contours_layer
    title: CUZK ZABAGED contour lines (overlay)
    sources: [cuzk_contours_cache]
  - name: cuzk_hillshade_layer
    title: CUZK DMR 5G shaded relief (overlay, opaque grey - use with opacity)
    sources: [cuzk_hillshade_cache]
  # ---- added 2026-11-08, batch M1 ------------------------------------------
  # New photo base maps, JPEG caches (the servers send JPEG: stored as
  # received, *.jpeg files). Google, Esri and Bing serve these tiles under
  # their own terms (no API key, no cache allowed by their terms); kept on the
  # owner's decision D40 (private robot, few tiles, risk accepted). The CUZK
  # layers are open data (CC BY 4.0).
  - name: gm_hybrid_layer
    title: Google hybrid - satellite with roads and names (JPEG)
    sources: [gm_hybrid_cache]
  - name: gm_map_layer
    title: Google map (PNG)
    sources: [gm_map_cache]
  - name: esri_layer
    title: Esri World Imagery (JPEG, real levels up to z18 here)
    sources: [esri_cache]
  - name: bing_layer
    title: Bing Aerial (JPEG, real levels up to z19 here)
    sources: [bing_cache]
  - name: cuzk_ortho_layer
    title: CUZK ortofoto CR, pre-rendered Web Mercator tiles (JPEG, z20)
    sources: [cuzk_wm_cache]
  # overlays
  - name: cuzk_slope_layer
    title: CUZK DMR 5G slope (overlay, opaque colour - use with opacity)
    sources: [cuzk_slope_cache]
  - name: cuzk_ruian_layer
    title: CUZK RUIAN buildings and house numbers (overlay)
    sources: [cuzk_ruian_cache]
  # ---- added 2026-11-08, batch M6 ------------------------------------------
  # More DMR 5G / DMP 1G renderings (tone overlays, opaque JPEG - the UI
  # multiplies them over the base map) and older Esri imagery (Wayback).
  - name: cuzk_hillshade_z10_layer
    title: CUZK DMR 5G shaded relief, height x10 (overlay, opaque grey)
    sources: [cuzk_hillshade_z10_cache]
  - name: cuzk_hillshade_z20_layer
    title: CUZK DMR 5G shaded relief, height x20 (overlay, opaque grey)
    sources: [cuzk_hillshade_z20_cache]
  - name: cuzk_aspect_layer
    title: CUZK DMR 5G aspect - slope direction (overlay, opaque colour)
    sources: [cuzk_aspect_cache]
  - name: cuzk_dmp_hillshade_layer
    title: CUZK DMP 1G shaded surface - trees and buildings (overlay, opaque grey)
    sources: [cuzk_dmp_hillshade_cache]
  - name: esri_wb_2025_r04_layer
    title: Esri World Imagery Wayback, release 2025-04-24 (JPEG, z18 here)
    sources: [esri_wb_2025_r04_cache]
  - name: esri_wb_2023_r05_layer
    title: Esri World Imagery Wayback, release 2023-06-13 (JPEG, z18 here)
    sources: [esri_wb_2023_r05_cache]
  - name: esri_wb_2022_r05_layer
    title: Esri World Imagery Wayback, release 2022-04-27 (JPEG, z18 here)
    sources: [esri_wb_2022_r05_cache]
  # ---- added 2026-11-08, batch M6-1 ----------------------------------------
  - name: cenia_hist_layer
    title: CENIA historical orthophoto, 1950s (greyscale JPEG, reprojected from S-JTSK, z18)
    sources: [cenia_hist_cache]
  # ---- added 2026-11-08, T20 -------------------------------------------------
  # Precipitation mosaic (OPERA, ČHMÚ, DWD, RainViewer merged by the robot's
  # own vitulus_precip service on port 8097), newest frame only. Transparent
  # PNG, nothing stored. The time slider of the UI talks to the service itself.
  - name: precip_mosaic
    title: Precipitation mosaic, latest frame (overlay, transparent PNG, vitulus_precip :8097)
    sources: [precip_mosaic_cache]


caches:
  #setup the cache for the open streetmap tiles. This cache is used by the layer above.
  osm_cache:
    sources: [osm_tiles]
    format: image/png
    grids: [webmercator]
  gm_cache:
    # format left at the default (image/png) on purpose: see layer gm_layer
    grids: [ gm_grid ]
    sources: [ gm ]
    cache:
      type: file
      directory_layout: tms
  # legacy PNG URL (layer cuzk_layer), never stored (meta_size 1x1: one tile
  # in = one tile out; the 4x4 default would pull 36 tiles from the source
  # for every single legacy request)
  cuzk_png_compat:
    grids: [ gm_grid ]
    sources: [ cuzk_wm_cache ]
    format: image/png
    disable_storage: true
    meta_size: [1, 1]
    meta_buffer: 0
  # ---- CUZK orthophoto: tiles (batch M1) + offline fallback (batch M4) ----
  # cuzk_wm_cache (layers cuzk_ortho_layer and, via cuzk_png_compat,
  # cuzk_layer) merges its sources, bottom first:
  #   cuzk_wm_coarse  coarser levels of cuzk_wm_cache itself, upscaled
  #   cuzk_cache      the pre-M1 WMS cache (read only, upscaled too)
  #   cuzk_wm         the CUZK tile server, z0-z20 (opaque JPEG)
  #   cuzk            the CUZK WMS, z21 only (opaque JPEG)
  # Online the server tile covers the fallbacks and is stored (decoded and
  # re-encoded once when a fallback had something under it). Offline the
  # server sources answer a transparent "nothing" that is never stored
  # (their on_error), so the fallbacks show through: the old cache tile,
  # else a coarser level. Where none has anything the tile is plain white
  # (HTTP 200, not stored) instead of a 500.
  # Why this shape (MapProxy 1.16, checked in its code and in a container):
  # upscale_tiles runs only when a source has no tile for the level
  # (max_res), never on a network error (that is a 500), and a cache with
  # several sources never upscales at all: where every source has nothing it
  # STORES a blank tile. Hence the WMS for z21 (as before batch M1) instead
  # of the old "z21 = z20 upscaled": a z21 with nothing local would
  # otherwise be stored white for good.
  # Same directory as before (name + EPSG900913): tiles already stored stay
  # valid. Filled on the first view or by the open-data seed (seed.yaml,
  # garden_cuzk).
  cuzk_wm_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_wm_coarse, cuzk_cache, cuzk_wm, cuzk ]
    format: image/jpeg
    # required: a tile source cannot do meta tiles (and one WMS request per
    # z21 tile, as the UI asks for single tiles)
    meta_size: [1, 1]
    meta_buffer: 0
    cache: {type: file, directory_layout: tms}
  # read-only view of cuzk_wm_cache's own directory (no source: never
  # fetches, never stores): its coarser levels, up to 4 levels (16x) up
  cuzk_wm_coarse:
    grids: [ gm_grid ]
    sources: []
    format: image/jpeg
    upscale_tiles: 4
    cache:
      type: file
      directory_layout: tms
      directory: ./cache_data/cuzk_wm_cache_EPSG900913
      # NOT the store's lock directory: same directory = same lock file
      # names, and the store holds a tile's lock while it reads this view
      tile_lock_dir: ./cache_data/tile_locks_ro
  # The pre-M1 cache of the CUZK orthophoto WMS (paletted PNG, z10-z21, 86 MB
  # on the robot), READ ONLY: the old name gives the old directory
  # (cache_data/cuzk_cache_EPSG900913). No source, so nothing is fetched or
  # written into it (upscaled tiles are not stored; its tile locks go to
  # cache_data/tile_locks). Up to 6 levels (64x) up. Once the directory is
  # deleted (after a successful seed, see README) it simply finds nothing.
  cuzk_cache:
    grids: [ gm_grid ]
    sources: []
    format: image/png
    upscale_tiles: 6
    cache: {type: file, directory_layout: tms}
  gm_hybrid_cache:
    grids: [ gm_grid ]
    sources: [ gm_hybrid ]
    format: image/jpeg
    cache: {type: file, directory_layout: tms}
  gm_map_cache:
    grids: [ gm_grid ]
    sources: [ gm_map ]
    # a drawn map with text: PNG keeps the lines sharp (Google sends PNG)
    format: image/png
    cache: {type: file, directory_layout: tms}
  esri_cache:
    grids: [ gm_grid ]
    sources: [ esri ]
    format: image/jpeg
    # z19+ answers a grey "Map data not yet available" tile here, never cache
    # that: finer levels are upscaled from z18
    upscale_tiles: 3
    cache: {type: file, directory_layout: tms}
  bing_cache:
    grids: [ gm_grid ]
    sources: [ bing ]
    format: image/jpeg
    # z20+ answers a "no tile" placeholder here: finer levels upscaled from z19
    upscale_tiles: 2
    cache: {type: file, directory_layout: tms}
  cuzk_ztm_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_ztm ]
    format: image/jpeg
    # the server has tiles up to z19 (404 above): finer levels are upscaled
    upscale_tiles: 2
    cache: {type: file, directory_layout: tms}
  otm_cache:
    grids: [ gm_grid ]
    sources: [ otm ]
    format: image/png
    # OpenTopoMap ends at z17 (above it answers a blank placeholder that must
    # never be cached): finer levels are upscaled from z17
    upscale_tiles: 4
    cache: {type: file, directory_layout: tms}
  cuzk_kn_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_kn ]
    format: image/png
    cache: {type: file, directory_layout: tms}
  cuzk_contours_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_contours ]
    format: image/png
    cache: {type: file, directory_layout: tms}
  cuzk_hillshade_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_hillshade ]
    format: image/jpeg
    cache: {type: file, directory_layout: tms}
  cuzk_slope_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_slope ]
    format: image/jpeg
    # minimize_meta_requests: only for WMS GetMap requests TO MapProxy (one
    # source request for the asked area instead of every meta tile it
    # touches). Tile requests (WMTS/TMS, the robot UI) still render the whole
    # 4x4 meta tile (+ buffer) per uncached tile.
    minimize_meta_requests: true
    cache: {type: file, directory_layout: tms}
  cuzk_ruian_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_ruian ]
    format: image/png
    minimize_meta_requests: true   # WMS clients only, see cuzk_slope_cache
    # empty (fully transparent) tiles share one file
    link_single_color_images: true
    cache: {type: file, directory_layout: tms}
  # ---- batch M6 --------------------------------------------------------------
  # DMR 5G / DMP 1G renderings: the data has 2 m pixels, so z18 (0.6 m/px in
  # Web Mercator, ~0.38 m on the ground here) is already 5x finer than the
  # data. Finer levels are upscaled from z18 (source max_res) instead of
  # fetched; the UI stops at z18 (max_zoom) and magnifies on its own.
  cuzk_hillshade_z10_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_hillshade_z10 ]
    format: image/jpeg
    upscale_tiles: 3
    minimize_meta_requests: true   # WMS clients only, see cuzk_slope_cache
    cache: {type: file, directory_layout: tms}
  cuzk_hillshade_z20_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_hillshade_z20 ]
    format: image/jpeg
    upscale_tiles: 3
    minimize_meta_requests: true
    cache: {type: file, directory_layout: tms}
  cuzk_aspect_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_aspect ]
    format: image/jpeg
    upscale_tiles: 3
    minimize_meta_requests: true
    cache: {type: file, directory_layout: tms}
  cuzk_dmp_hillshade_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_dmp_hillshade ]
    format: image/jpeg
    upscale_tiles: 3
    minimize_meta_requests: true
    cache: {type: file, directory_layout: tms}
  # Esri Wayback releases (as esri_cache: real levels up to z18 at the site,
  # finer levels upscaled). A release never changes, so a stored tile stays
  # right; cleaned after 90 days only to keep the disk small (cleanup.yaml).
  esri_wb_2025_r04_cache:
    grids: [ gm_grid ]
    sources: [ esri_wb_2025_r04 ]
    format: image/jpeg
    upscale_tiles: 3
    cache: {type: file, directory_layout: tms}
  esri_wb_2023_r05_cache:
    grids: [ gm_grid ]
    sources: [ esri_wb_2023_r05 ]
    format: image/jpeg
    upscale_tiles: 3
    cache: {type: file, directory_layout: tms}
  esri_wb_2022_r05_cache:
    grids: [ gm_grid ]
    sources: [ esri_wb_2022_r05 ]
    format: image/jpeg
    upscale_tiles: 3
    cache: {type: file, directory_layout: tms}
  # ---- batch M6-1 ------------------------------------------------------------
  # CENIA historical orthophoto (1950s). The source answers only in S-JTSK
  # (EPSG:5514): MapProxy fetches one 4x4 meta tile (+ buffer) in S-JTSK per
  # uncached tile and reprojects it into gm_grid (CPU, see README). Data
  # 0.5 m/px: z18 is fetched, z19-z21 upscaled from it. Never changes: cleaned
  # after 90 days only to keep the disk small (cleanup.yaml).
  cenia_hist_cache:
    grids: [ gm_grid ]
    sources: [ cenia_hist ]
    format: image/jpeg
    upscale_tiles: 3
    cache: {type: file, directory_layout: tms}
  # ---- T20: precipitation mosaic ---------------------------------------------
  # The frame behind "latest" changes every 5 min: never stored, every request
  # goes to the local service (which caches its rendered tiles itself).
  # The service draws z3-z8 around the site (source max_res = z8); z9-z21
  # are upscaled from the z8 tile (13 levels), one service request each.
  precip_mosaic_cache:
    grids: [ gm_grid ]
    sources: [ precip_mosaic ]
    format: image/png
    disable_storage: true
    upscale_tiles: 13
    meta_size: [1, 1]
    meta_buffer: 0


sources:
  osm_tiles:
    #the osm_tiles source refers to the openstreetmap.org tiles. These will be downloaded upon request (if not already cached) and served by MapProxy
    type: tile
    # https and an identifying User-Agent, as the OSM tile usage policy asks
    # (plain http only got a redirect to https; batch M4, audit M4-6)
    url: https://tile.openstreetmap.org/%(tms_path)s.%(format)s
    grid: webmercator
    http:
      headers:
        User-Agent: 'Vitulus-robot-MapProxy/1.16 (private garden robot)'
  gm:
    type: tile
    url: http://mt0.google.com/vt/lyrs=s@0&hl=en&x=%(x)s&y=%(y)s&z=%(z)s
    grid: gm_grid
  cuzk:
    # CUZK ortofoto CR — official Czech orthophoto, ~12.5 cm, refreshed on a
    # 2-year cycle, free WMS without an API key. Verified 2026-08-01: serves
    # EPSG:3857 directly. Since batch M1 the tiles come from cuzk_wm; batch
    # M4 uses this WMS again for z21 ONLY (in cuzk_wm_cache, see there): the
    # z21 picture the robot had before M1. Only legacy cuzk_layer clients
    # ask for z21 (the UI catalog stops the orthophoto at z20).
    # For a rollback to the WMS remove min_res.
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    # z21 only (0.0746 m/px); z20 (0.149 m/px) and coarser come from cuzk_wm
    min_res: 0.1
    on_error:
      other:
        response: transparent
        cache: false
    req:
      url: https://ags.cuzk.cz/arcgis1/services/ORTOFOTO/MapServer/WMSServer
      layers: 0
      transparent: false
  # ---- added 2026-11-08 ---------------------------------------------------
  # CUZK sources: (c) CUZK, open data, no key. OpenTopoMap: CC-BY-SA, no key,
  # credit required. Tiles verified 2026-11-08 at the robot's site. Not added:
  # the CUZK orthophoto ARCHIVE WMS (answers non-browser clients with a
  # redirect to its terms page).
  cuzk_ztm:
    # cached Web Mercator tiles of the CUZK ArcGIS server (ArcGIS order z/y/x)
    type: tile
    url: https://ags.cuzk.cz/arcgis1/rest/services/ZTM_WM/MapServer/tile/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    # finest level the server has: z19 of gm_grid (0.2986 m/px). max_res sits
    # BELOW the level resolution: at exactly 0.29858... float rounding counted
    # z19 itself as out of range and served z18 upscaled (found 2026-11-08)
    max_res: 0.25
  otm:
    type: tile
    url: https://a.tile.opentopomap.org/%(z)s/%(x)s/%(y)s.png
    grid: gm_grid
    # finest real level: z17 of gm_grid (1.194 m/px). Below the level value
    # for the float reason measured on cuzk_ztm (there the exact value served
    # z19 upscaled from z18); with 1.0 a z17 request stores a z17 tile
    # (checked 2026-11-08 in a local container).
    max_res: 1.0
    http:
      headers:
        User-Agent: 'Vitulus-robot-MapProxy/1.16 (private garden robot)'
  cuzk_kn:
    # KN_I = the "inverse" cadastre: light lines meant for orthophoto and dark
    # backgrounds. The server draws it from about z16 (scale limit).
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    req:
      url: https://services.cuzk.cz/wms/wms.asp
      layers: KN_I
      transparent: true
  cuzk_contours:
    # drawn by the server from about z16 (scale limit)
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    req:
      url: https://ags.cuzk.cz/arcgis/services/ZABAGED_VRSTEVNICE/MapServer/WMSServer
      layers: '0'
      transparent: true
  cuzk_hillshade:
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:GrayscaleHillshade'
      transparent: false
  # ---- added 2026-11-08, batch M1 ------------------------------------------
  # concurrent_requests (corrected in batch M4 from the MapProxy 1.16 code,
  # mapproxy/config/loader.py): only WMS sources use it, as a file semaphore
  # in cache_data/locks keyed by the server's HOST NAME, so it holds across
  # all uWSGI processes and is SHARED by every WMS source on that host
  # (here the six ags.cuzk.cz WMS sources with a limit, cuzk_slope,
  # cuzk_ruian and the batch M6 renderings, share 4 slots; contours, the
  # relief cuzk_hillshade, cuzk z21 and the tile sources on that host are not
  # limited by it). The lock waits up to the source's http.client_timeout
  # (15 s for the ČÚZK WMS sources, see globals http). Tile
  # sources (type: tile) accept the key and ignore it.
  # T17: limit 4 instead of 1 (slope, RÚIAN) and 2 (M6), measured 2026-11-08
  # at public points in Prague (local container, cold cache, 108 tiles of
  # RÚIAN + slope + relief x10 at z17/z18): a burst of 24 parallel tile
  # requests took 4.2 s instead of 10.3 s (median of 7 runs each), RÚIAN
  # fully there after ~1.5 s instead of ~5 s; 6 parallel requests (one
  # browser) 7.3 s instead of 11.2 s; mapproxy-seed -c 4 6.5 s instead of
  # 14.2 s (scripts/seed_garden.sh runs -c 1: no change there). The RÚIAN
  # WMS itself answered 96 parallel GetMaps at 1/2/4/8 at once with no
  # 429/503, ~0.6-0.8 s each at any level. One of the 7 limit-4 bursts
  # (right after a slow limit-1 run, ČÚZK slow at that time) met an upstream
  # read hanging 60 s: uWSGI harakiri (60 s) killed 4 workers and 42 of 108
  # tiles failed. A hung ČÚZK hurts with any limit (with 1 the waiters time
  # out on the lock instead).
  gm_hybrid:
    type: tile
    url: https://mt0.google.com/vt/lyrs=y&hl=en&x=%(x)s&y=%(y)s&z=%(z)s
    grid: gm_grid
    concurrent_requests: 1
  gm_map:
    type: tile
    url: https://mt0.google.com/vt/lyrs=m&hl=en&x=%(x)s&y=%(y)s&z=%(z)s
    grid: gm_grid
    concurrent_requests: 1
  esri:
    # Esri World Imagery (ArcGIS tile order z/y/x)
    type: tile
    url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    # finest real level at the site: z18 of gm_grid (0.597 m/px); max_res
    # below the level value (see cuzk_ztm)
    max_res: 0.5
    concurrent_requests: 1
  bing:
    # Bing Maps aerial (quadkey addressing, gm_grid origin ul = Bing's)
    type: tile
    url: https://ecn.t0.tiles.virtualearth.net/tiles/a%(quadkey)s.jpeg?g=1
    grid: gm_grid
    # finest real level at the site: z19 of gm_grid (0.299 m/px); max_res
    # below the level value (see cuzk_ztm)
    max_res: 0.25
    concurrent_requests: 1
  cuzk_wm:
    # CUZK Ortofoto CR as cached Web Mercator tiles (ArcGIS order z/y/x),
    # 12.5 cm, open data CC BY 4.0. Replaces the WMS 'cuzk' below: no
    # rendering on the server, smaller JPEG tiles, identical picture.
    type: tile
    url: https://ags.cuzk.cz/arcgis1/rest/services/ORTOFOTO_WM/MapServer/tile/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    # finest level the server has: z20 of gm_grid (0.149 m/px); max_res
    # below the level value (see cuzk_ztm)
    max_res: 0.12
    concurrent_requests: 1
    # batch M4: any failure (no network, DNS, timeout, HTTP error) gives a
    # transparent tile that is NOT cached, so the offline fallbacks of
    # cuzk_wm_cache show through instead of a 500 (see cuzk_wm_cache)
    on_error:
      other:
        response: transparent
        cache: false
  cuzk_slope:
    # DMR 5G terrain slope, colour (yellow-orange-red = steeper), 2 m pixels
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:SlopeRGBMap'
      transparent: false
  cuzk_ruian:
    # RUIAN building outlines (StavebniObjekt, drawn from about z16) and
    # address points with house numbers (AdresniMisto, from about z18)
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    req:
      url: https://ags.cuzk.cz/arcgis/services/RUIAN/MapServer/WMSServer
      layers: 'StavebniObjekt,AdresniMisto'
      transparent: true
  # ---- added 2026-11-08, batch M6 ------------------------------------------
  # DMR 5G (terrain) and DMP 1G (surface with trees and buildings) are ČÚZK
  # image services (2 m pixels, lidar 2009-2013), open data, no key; the
  # same server as cuzk_hillshade / cuzk_slope, other server-side renderings.
  # concurrent_requests 4: the semaphore is per host (ags.cuzk.cz, see the
  # note above gm_hybrid) and its slots are shared: these, cuzk_slope and
  # cuzk_ruian all pick one of the same 4 slots (at random, then the next
  # free one), so at most 4 renderings of them run on ags.cuzk.cz at once.
  # max_res: finest level fetched is z18 (0.597 m/px); 0.5 sits below the
  # level value (see cuzk_ztm), the caches upscale z19-z21.
  cuzk_hillshade_z10:
    # shaded relief with heights x10: a flat garden's micro-relief shows
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    max_res: 0.5
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:GrayscaleHillshadeZ10'
      transparent: false
  cuzk_hillshade_z20:
    # the same with heights x20 (deep shadows on real slopes)
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    max_res: 0.5
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:GrayscaleHillshadeZ20'
      transparent: false
  cuzk_aspect:
    # aspect = which way the ground faces, colour by direction
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    max_res: 0.5
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:AspectRGBMap'
      transparent: false
  cuzk_dmp_hillshade:
    # DMP 1G shaded: tree crowns and buildings (as in 2009-2013)
    type: wms
    supported_srs: ['EPSG:3857']
    http: {client_timeout: 15}   # T17, see globals http
    concurrent_requests: 4
    max_res: 0.5
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmp1g/ImageServer/WMSServer
      layers: 'dmp1g:GrayscaleHillshade'
      transparent: false
  # Esri World Imagery Wayback: earlier releases of World Imagery, same terms
  # as esri (D40), no key. Tile order release/z/y/x; a tile that a release
  # took over unchanged from an older one answers 301 to that release (the
  # HTTP client follows it). Picked from the 198 releases with the Wayback
  # metadata (tilemap service, 2026-11-08): releases whose z18 tile at the
  # site differs from the next newer one were 2025-10 (the newest, =
  # esri_layer), 2025-04, 2024-02, 2023-06 and 2022-04. 2024-02 is left out:
  # at a public test point (Prague) its tile is byte for byte the 2025-04
  # one. There the three kept show three capture dates, all older than
  # esri_layer's (metadata SRC_DATE).
  esri_wb_2025_r04:
    type: tile
    url: https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/27982/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    max_res: 0.5
  esri_wb_2023_r05:
    type: tile
    url: https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/25982/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    max_res: 0.5
  esri_wb_2022_r05:
    type: tile
    url: https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/16245/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    max_res: 0.5
  # ---- added 2026-11-08, batch M6-1 ----------------------------------------
  # CENIA "Historická ortofotomapa (50. léta)": aerial photos mostly from
  # 1952-1954 (gaps filled with 1937-1970 and 1996), greyscale, 0.5 m/px.
  # Licence CC BY 4.0 (metadata record of the dataset in the CENIA catalogue
  # micka, 50210752-9d9c-4f47-956b-1951c0a80137; the view service record
  # 60b09c14-9538-4a0f-a66c-6118c0a80164 says the same), credit "© CENIA 2010
  # a © GEODIS BRNO 2010, snímky VGHMÚř Dobruška, © MO ČR 2009". MapCache WMS
  # 1.1.1, EPSG:5514 only (EPSG:3857 answers 400): MapProxy reprojects with
  # PROJ (S-JTSK to WGS 84 (5), 1 m accuracy in Czechia).
  cenia_hist:
    type: wms
    supported_srs: ['EPSG:5514']
    # z18 (0.597 m/px) is the finest level fetched; the server's finer
    # levels only magnify the 0.5 m data. Below the level value, see cuzk_ztm.
    max_res: 0.5
    # its own host (gis.cenia.cz): one rendering at a time
    concurrent_requests: 1
    http: {client_timeout: 15}   # T17, see globals http (lock 20 + slot 15 + read 15 < harakiri 60)
    # extent from GetCapabilities: outside Czechia return empty tiles, no request
    coverage:
      bbox: [-925000, -1444353.536, -400646.464, -920000]
      srs: 'EPSG:5514'
    req:
      url: https://gis.cenia.cz/mapcache/ortofotomapa_historicka/wms
      layers: orto
      transparent: false
  # ---- added 2026-11-08, T20 -------------------------------------------------
  # vitulus_precip (its own container on the HOST network, precip-mosaic
  # deploy/docker-compose.yml, port 8097 on all interfaces; or the same service
  # started by hand / as the ROS node with server.host 0.0.0.0). This container runs on the compose
  # bridge network, not the host network, so "localhost" would be the
  # container itself: host.docker.internal is mapped to the host by
  # extra_hosts (host-gateway) in docker-compose-build.yml.
  # Outside its area (and below z3) the service answers an empty transparent
  # PNG. Terms: OPERA CC BY 4.0, ČHMÚ open data, RainViewer personal use only
  # (not redistributable) — the robot UI only, never a public endpoint.
  precip_mosaic:
    type: tile
    url: http://host.docker.internal:8097/tiles/latest/%(z)s/%(x)s/%(y)s.png
    grid: gm_grid
    transparent: true
    # finest level the service draws: z8 of gm_grid (611.5 m/px); max_res
    # below the level value (see cuzk_ztm), the cache upscales z9-z21
    max_res: 500
    http:
      # a hung service must not hold a uWSGI thread for the global 20 s
      # (globals http)
      client_timeout: 15
    # service down, not started, DNS name missing (container not recreated
    # after the compose change), HTTP error: a transparent tile, so the layer
    # is simply empty and nothing else is affected (no 500)
    on_error:
      other:
        response: transparent
        cache: false


grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
  gm_grid:
    base: GLOBAL_MERCATOR
    origin: ul
    # 22 levels = max z21 (~7.5 cm/px at lat 50): lets the CUZK 12.5 cm
    # ortofoto and Google z20 through; existing z0-19 cache tiles stay valid
    num_levels: 22



globals:
  # T17: time limits under uWSGI harakiri (60 s, build_data/uwsgi.ini), which
  # kills a whole worker with its other 9 threads (other layers' requests
  # die with it). A tile request waits at most for: the meta-tile lock
  # (global http.client_timeout, MapProxy 1.16 has no per-cache value) +
  # the concurrent_requests slot (the source's client_timeout) + the source
  # read (the same). The ČÚZK WMS sources have 15 s: 20 + 15 + 15 = 50 s.
  # Measured 2026-11-08 with a fake hung/45-s-slow WMS in place of RÚIAN
  # (36 RÚIAN + 36 OpenTopoMap tiles, 24 at once): with 60/60 s (before)
  # and with 30 s on the source only, 20-35 RÚIAN requests were cut at
  # 60 s by harakiri (connection dropped); with 20/15 s all 36 answered 500
  # within 45 s, no harakiri, OpenTopoMap 36x 200 in < 0.6 s throughout.
  # Normal ČÚZK renderings take 0.5-2 s (slowest seen 12 s), other sources
  # well under 1 s; the global 20 s also is the read timeout of every source
  # without its own value.
  http:
    client_timeout: 20
  #next are some global configuration options for MapProxy. They mostly explain themselves, or can be looked-up in the MapProxy docs.
  cache:
    # where to store the cached images
    base_dir: './cache_data'
    # where to store lockfiles
    lock_dir: './cache_data/locks'
  # browser-side tile expiry: 1 hour instead of the 72h default (ETag keeps
  # revalidation cheap; 72h made stale tiles stick in the browser cache)
  tiles:
    expires_hours: 1