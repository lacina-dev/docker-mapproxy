services:
  #sets up how to make the source data available
  demo:
  kml:
  wmts:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  wms:
    #srs sets the coordinate reference systems as which you want to make your data available. MapProxy reprojects the source data very well to these projections.
#    srs: ['EPSG:3857']
#    image_formats: ['image/png']
    md:
      # metadata used in capabilities documents
      title: Mapproxy OSM cache
      abstract: This is the MapProxy
      fees: 'None'


layers:
  #sets up which layers you want to make available using the services above. You can add many, but let's stick to osm data here.
  - name: osm_demo      # access in JOSM as TMS: http://localhost:8080/tiles/1.0.0/osm_demo/webmercator/{zoom}/{x}/{y}.png
    title: Open Streetmap Tiles (test)
    sources: [osm_cache]
  - name: gm_layer
    title: Test of using GM tiles
    sources: [ gm_cache ]
  - name: cuzk_layer
    title: CUZK ortofoto CR (12.5 cm, free WMS, no key)
    sources: [ cuzk_cache ]
  # ---- added 2026-11-08 (map sources for the robot UI) -------------------
  # The UI lists these from ui_sources.json (same directory): keep the two in
  # step ("layer" there = name here). All on gm_grid (EPSG:3857, origin ul,
  # z0-z21): the UI fetches /wmts/<name>/gm_grid/{z}/{x}/{y}.<png|jpeg>.
  - name: cuzk_ztm_layer
    title: CUZK ZTM - Base topographic map of CR (open data, no key)
    sources: [cuzk_ztm_cache]
  - name: otm_layer
    title: OpenTopoMap (CC-BY-SA, no key, max z17)
    sources: [otm_cache]
  # overlays (transparent PNG unless noted)
  - name: cuzk_kn_layer
    title: CUZK cadastre - parcels and boundaries, light lines (overlay)
    sources: [cuzk_kn_cache]
  - name: cuzk_contours_layer
    title: CUZK ZABAGED contour lines (overlay)
    sources: [cuzk_contours_cache]
  - name: cuzk_hillshade_layer
    title: CUZK DMR 5G shaded relief (overlay, opaque grey - use with opacity)
    sources: [cuzk_hillshade_cache]


caches:
  #setup the cache for the open streetmap tiles. This cache is used by the layer above.
  osm_cache:
    sources: [osm_tiles]
    format: image/png
    grids: [webmercator]
  gm_cache:
    grids: [ gm_grid ]
    sources: [ gm ]
    cache:
      type: file
      directory_layout: tms
  cuzk_cache:
    grids: [ gm_grid ]
    sources: [ cuzk ]
    format: image/png
    cache:
      type: file
      directory_layout: tms
  cuzk_ztm_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_ztm ]
    format: image/jpeg
    # the server has tiles up to z19 (404 above): finer levels are upscaled
    upscale_tiles: 2
    cache: {type: file, directory_layout: tms}
  otm_cache:
    grids: [ gm_grid ]
    sources: [ otm ]
    format: image/png
    # OpenTopoMap ends at z17 (above it answers a blank placeholder that must
    # never be cached): finer levels are upscaled from z17
    upscale_tiles: 4
    cache: {type: file, directory_layout: tms}
  cuzk_kn_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_kn ]
    format: image/png
    cache: {type: file, directory_layout: tms}
  cuzk_contours_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_contours ]
    format: image/png
    cache: {type: file, directory_layout: tms}
  cuzk_hillshade_cache:
    grids: [ gm_grid ]
    sources: [ cuzk_hillshade ]
    format: image/jpeg
    cache: {type: file, directory_layout: tms}


sources:
  osm_tiles:
    #the osm_tiles source refers to the openstreetmap.org tiles. These will be downloaded upon request (if not already cached) and served by MapProxy
    type: tile
    url: http://tile.openstreetmap.org/%(tms_path)s.%(format)s
    grid: webmercator
  gm:
    type: tile
    url: http://mt0.google.com/vt/lyrs=s@0&hl=en&x=%(x)s&y=%(y)s&z=%(z)s
    grid: gm_grid
  cuzk:
    # CUZK ortofoto CR — official Czech orthophoto, ~12.5 cm, refreshed on a
    # 2-year cycle, free WMS without an API key. Verified 2026-08-01: serves
    # EPSG:3857 directly (no reprojection needed).
    type: wms
    supported_srs: ['EPSG:3857']
    req:
      url: https://ags.cuzk.cz/arcgis1/services/ORTOFOTO/MapServer/WMSServer
      layers: 0
      transparent: false
  # ---- added 2026-11-08 ---------------------------------------------------
  # CUZK sources: (c) CUZK, open data, no key. OpenTopoMap: CC-BY-SA, no key,
  # credit required. Tiles verified 2026-11-08 at the site (50.0187 N,
  # 14.9033 E). Not added: Esri World Imagery (licence terms unclear for this
  # use) and the CUZK orthophoto ARCHIVE WMS (answers non-browser clients with
  # a redirect to its terms page).
  cuzk_ztm:
    # cached Web Mercator tiles of the CUZK ArcGIS server (ArcGIS order z/y/x)
    type: tile
    url: https://ags.cuzk.cz/arcgis1/rest/services/ZTM_WM/MapServer/tile/%(z)s/%(y)s/%(x)s
    grid: gm_grid
    # finest level the server has: z19 of gm_grid (0.2986 m/px)
    max_res: 0.2985821417389697
  otm:
    type: tile
    url: https://a.tile.opentopomap.org/%(z)s/%(x)s/%(y)s.png
    grid: gm_grid
    # finest real level: z17 of gm_grid (1.194 m/px)
    max_res: 1.1943285668550503
    http:
      headers:
        User-Agent: 'Vitulus-robot-MapProxy/1.16 (private garden robot)'
  cuzk_kn:
    # KN_I = the "inverse" cadastre: light lines meant for orthophoto and dark
    # backgrounds. The server draws it from about z16 (scale limit).
    type: wms
    supported_srs: ['EPSG:3857']
    req:
      url: https://services.cuzk.cz/wms/wms.asp
      layers: KN_I
      transparent: true
  cuzk_contours:
    # drawn by the server from about z16 (scale limit)
    type: wms
    supported_srs: ['EPSG:3857']
    req:
      url: https://ags.cuzk.cz/arcgis/services/ZABAGED_VRSTEVNICE/MapServer/WMSServer
      layers: '0'
      transparent: true
  cuzk_hillshade:
    type: wms
    supported_srs: ['EPSG:3857']
    req:
      url: https://ags.cuzk.cz/arcgis2/services/dmr5g/ImageServer/WMSServer
      layers: 'dmr5g:GrayscaleHillshade'
      transparent: false


grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
  gm_grid:
    base: GLOBAL_MERCATOR
    origin: ul
    # 22 levels = max z21 (~7.5 cm/px at lat 50): lets the CUZK 12.5 cm
    # ortofoto and Google z20 through; existing z0-19 cache tiles stay valid
    num_levels: 22



globals:
  #next are some global configuration options for MapProxy. They mostly explain themselves, or can be looked-up in the MapProxy docs.
  cache:
    # where to store the cached images
    base_dir: './cache_data'
    # where to store lockfiles
    lock_dir: './cache_data/locks'
  # browser-side tile expiry: 1 hour instead of the 72h default (ETag keeps
  # revalidation cheap; 72h made stale tiles stick in the browser cache)
  tiles:
    expires_hours: 1