# Seeding of the robot's surroundings (Vitulus) — fills the caches of a small
# square around the site in advance, so the map has the photos offline in the
# garden and the first view is instant.
#
# Run it ONLY through scripts/seed_garden.sh: it writes the area file
# seed_area.wkt (next to this file, NOT in git: the site position is private)
# from the robot's own map datum and runs mapproxy-seed with ONE request at a
# time. Default is a dry run (counts only) of the default tasks garden_cuzk
# (open data) and garden_google_sat (the UI's default base, Google
# satellite); the other commercial tasks run only when named with --tasks:
#
#     scripts/seed_garden.sh                       # dry run, default tasks
#     scripts/seed_garden.sh --go                  # fetch the default tasks
#     scripts/seed_garden.sh --tasks garden_cuzk   # open data only
#     scripts/seed_garden.sh --tasks garden_photo_esri   # dry run of another task
#
# 400 x 400 m (half side 200 m) is about 430 tiles per layer for z14-z20.
# z21 is not seeded (about 1100 more tiles per layer; the UI magnifies z20).
#
# Not here on purpose: OpenStreetMap and OpenTopoMap (their tile usage
# policies forbid bulk downloading).

coverages:
  garden:
    # POLYGON in EPSG:4326 (lon lat), written by scripts/seed_garden.sh
    datasource: 'seed_area.wkt'
    srs: 'EPSG:4326'

seeds:
  # CUZK open data (CC BY 4.0, no limits beyond "no excessive load")
  garden_cuzk:
    caches: [cuzk_wm_cache, cuzk_ztm_cache, cuzk_hillshade_cache, cuzk_slope_cache,
             cuzk_kn_cache, cuzk_contours_cache, cuzk_ruian_cache]
    coverages: [garden]
    levels:
      from: 14
      to: 20
    # the orthophoto is re-flown every 2 years: refresh tiles older than a year
    refresh_before:
      weeks: 52
  # commercial photo bases (Google, Esri, Bing): their terms do not allow
  # caching; seeding them is the owner's call (decision D40).
  # garden_google_sat is a DEFAULT task of scripts/seed_garden.sh (decided
  # 2026-11-08, T17 audit M4-2): the UI's default base is Google satellite
  # (gm_cache), so offline in the garden it has the whole square, not only
  # what was viewed before. Same levels as garden_cuzk. Tiles already in the
  # cache are kept (no refresh_before: the warm cache stays as it is).
  garden_google_sat:
    caches: [gm_cache]
    coverages: [garden]
    levels:
      from: 14
      to: 20
  # the others run only when asked. Levels stop at each source's real level
  # (the caches upscale beyond it).
  garden_photo_google:
    caches: [gm_cache, gm_hybrid_cache]
    coverages: [garden]
    levels:
      from: 14
      to: 20
  garden_photo_esri:
    caches: [esri_cache]
    coverages: [garden]
    levels:
      from: 14
      to: 18
  garden_photo_bing:
    caches: [bing_cache]
    coverages: [garden]
    levels:
      from: 14
      to: 19
