;T17 M9-3 (2026-11-08): the robot's uWSGI settings, written to /settings/uwsgi.ini
;by scripts/start.sh on EVERY container start in single mode (MULTI_MAPPROXY=false,
;the robot; envsubst, same variables as the
;image's build_data/uwsgi.ini). The image default restarted every worker after an
;hour and after 1000 requests: with 16-20 workers that was a restart about every
;3 minutes (8 in 25 min on the robot, map_audit2.md section 0), a tile in flight
;could come back empty. A day / 20000 requests now; reload-on-rss (512 MB, a worker
;uses ~50 MB) is the guard against a growing one. Not named uwsgi.ini: the image's
;env-data.sh copies a uwsgi.ini of the config directory verbatim (no envsubst).
[uwsgi]
;https://www.bloomberg.com/company/stories/configuring-uwsgi-production-deployment/
chdir = ${CONFIG_DATA_PATH}
pyargv = /mapproxy.yaml
wsgi-file = ${MAPPROXY_APP_DIR}/app.py
pidfile=/tmp/mapproxy.pid
http = 0.0.0.0:8080
processes = ${PROCESSES}             ; Maximum number of workers allowed
cheaper = ${CHEAPER}                         ; Minimum number of workers allowed
enable-threads = true
threads = ${THREADS}
master = true
vacuum = true
die-on-term = true                   ; Shutdown when receiving SIGTERM (default is respawn)
need-app = true
max-requests = 20000                 ; Restart workers after this many requests (T17 M9-3: was 1000)
max-worker-lifetime = 86400          ; Restart workers after this many seconds (T17 M9-3: was 3600)
reload-on-rss = 512                  ; Restart workers after this much resident memory (T17 M9-3: was 2048)
worker-reload-mercy = 60             ; How long to wait before forcefully killing workers
disable-logging = ${DISABLE_LOGGING}               
log-4xx = ${LOG4XX}
log-5xx = ${LOG5XX}
wsgi-disable-file-wrapper = true
memory-report = true
harakiri = 60
py-callos-afterfork = true           ; allow workers to trap signals
cheaper-algo = busyness
cheaper-initial = ${CHEAPER}                ; Workers created at startup
cheaper-overload = 1                 ; Length of a cycle in seconds
cheaper-step = ${CHEAPER}                    ; How many workers to spawn at a time
cheaper-busyness-multiplier = 30     ; How many cycles to wait before killing workers
cheaper-busyness-min = 20            ; Below this threshold, kill workers (if stable for multiplier cycles)
cheaper-busyness-max = 70            ; Above this threshold, spawn new workers
cheaper-busyness-backlog-alert = ${CHEAPER}  ; Spawn emergency workers if more than this many requests are waiting in the queue
cheaper-busyness-backlog-step = 2    ; How many emergency workers to create if there are too many requests in the queue
chmod-socket = 664
uid = ${MAPPROXY_USER_ID}
gid = ${MAPPROXY_GROUP_ID}
